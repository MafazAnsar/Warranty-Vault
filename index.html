<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#0f766e"><title>Warranty Vault</title>
<style>
:root{--bg:#f4f6f8;--card:#fff;--tx:#14202b;--mu:#667585;--pr:#0f766e;--ok:#15803d;--wa:#b45309;--er:#b91c1c;--bd:#e2e8ee}
@media(prefers-color-scheme:dark){:root{--bg:#10171d;--card:#1a232b;--tx:#e8eef3;--mu:#93a2b0;--pr:#2dd4bf;--ok:#4ade80;--wa:#fbbf24;--er:#f87171;--bd:#2b3742}}
*{box-sizing:border-box}body{margin:0;font:15px system-ui,sans-serif;background:var(--bg);color:var(--tx);padding-bottom:90px}
header{background:var(--pr);color:#fff;padding:14px 16px;padding-top:calc(14px + env(safe-area-inset-top));display:flex;justify-content:space-between;align-items:center;position:sticky;top:0;z-index:5}
@media(prefers-color-scheme:dark){header{color:#06231f}}
h1{font-size:19px;margin:0}header button{background:none;border:0;font-size:22px;color:inherit;margin-left:10px}
main{padding:12px;max-width:640px;margin:auto}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:10px}
.stat{background:var(--card);border-radius:12px;padding:8px 4px;text-align:center;border:1px solid var(--bd)}.stat b{display:block;font-size:20px}.stat span{font-size:11px;color:var(--mu)}
.alert{padding:10px 12px;border-radius:10px;margin-bottom:6px;font-size:14px;border-left:5px solid}
.alert.w{background:#fef3c7;border-color:#d97706;color:#78350f}.alert.e{background:#fee2e2;border-color:#dc2626;color:#7f1d1d}
input,select,textarea{width:100%;padding:10px;border:1px solid var(--bd);border-radius:10px;background:var(--card);color:var(--tx);font:inherit;margin:3px 0 8px}
label{font-size:12px;color:var(--mu)}
.chips{display:flex;gap:6px;overflow-x:auto;padding-bottom:8px}.chip{white-space:nowrap;padding:6px 12px;border-radius:99px;border:1px solid var(--bd);background:var(--card);color:var(--tx);font-size:13px}.chip.on{background:var(--pr);color:#fff;border-color:var(--pr)}
@media(prefers-color-scheme:dark){.chip.on{color:#06231f}}
.card{display:flex;gap:10px;background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:10px;margin-bottom:8px}
.th{width:60px;height:60px;border-radius:10px;background:var(--bg);object-fit:cover;display:flex;align-items:center;justify-content:center;font-size:28px;flex:none}
.card .i{flex:1;min-width:0}.card b{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.sm{font-size:12px;color:var(--mu)}
.bd{display:inline-block;padding:2px 8px;border-radius:99px;font-size:11px;font-weight:600;color:#fff}.ok{background:var(--ok)}.wa{background:var(--wa)}.er{background:var(--er)}
@media(prefers-color-scheme:dark){.bd{color:#10171d}}
.bar{height:5px;background:var(--bd);border-radius:9px;margin-top:6px;overflow:hidden}.bar i{display:block;height:100%}
.fab{position:fixed;right:18px;bottom:calc(18px + env(safe-area-inset-bottom));width:58px;height:58px;border-radius:50%;border:0;background:var(--pr);color:#fff;font-size:30px;box-shadow:0 4px 12px #0005}
@media(prefers-color-scheme:dark){.fab{color:#06231f}}
dialog{border:0;border-radius:16px;padding:16px;width:min(94vw,560px);max-height:92vh;background:var(--bg);color:var(--tx)}dialog::backdrop{background:#0008}
.btn{padding:10px 14px;border-radius:10px;border:1px solid var(--bd);background:var(--card);color:var(--tx);font:inherit;margin:3px 3px 3px 0}.btn.p{background:var(--pr);color:#fff;border-color:var(--pr)}.btn.d{color:var(--er)}
@media(prefers-color-scheme:dark){.btn.p{color:#06231f}}
.ph{display:flex;gap:6px;flex-wrap:wrap}.ph div{position:relative}.ph img{width:80px;height:80px;object-fit:cover;border-radius:8px}.ph u{position:absolute;top:0;right:0;background:#000a;color:#fff;border-radius:50%;width:20px;height:20px;text-align:center;text-decoration:none;font-size:13px}
.big img{width:100%;border-radius:10px;margin:4px 0}.g2{display:grid;grid-template-columns:1fr 1fr;gap:8px}.rm label{display:inline-flex;align-items:center;gap:4px;margin-right:10px;color:var(--tx);font-size:14px}.rm input{width:auto;margin:0}
.row{display:flex;justify-content:space-between;padding:6px 0;border-bottom:1px solid var(--bd)}.empty{text-align:center;color:var(--mu);padding:40px 10px}
</style></head><body>
<header><h1>🛡️ Warranty Vault</h1><div><button id="bell" title="Alerts">🔔</button><button id="gear" title="Settings">⚙️</button></div></header>
<main><div id="alerts"></div><div class="stats" id="stats"></div>
<input id="q" placeholder="Search name, brand, serial, store…"><div class="chips" id="chips"></div><div id="list"></div></main>
<button class="fab" id="add">+</button><dialog id="dlg"></dialog>
<script>
const CATS=['📱 Electronics','🏠 Appliances','🚗 Vehicle','🛋️ Furniture','🔧 Tools','⌚ Personal','🏗️ Property','📦 Other'];
const REM=[90,60,30,14,7,1];const DAY=864e5;
const $=s=>document.querySelector(s);const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const ls={get(k,d){try{const v=localStorage.getItem(k);return v==null?d:JSON.parse(v)}catch{return d}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch{}}};
const DB=new Promise((res,rej)=>{const r=indexedDB.open('wv',1);r.onupgradeneeded=()=>r.result.createObjectStore('items',{keyPath:'id'});r.onsuccess=()=>res(r.result);r.onerror=rej});
const tx=async(m,f)=>{const d=await DB;return new Promise((res,rej)=>{const t=d.transaction('items',m);const r=f(t.objectStore('items'));t.oncomplete=()=>res(r.result);t.onerror=rej})};
const getAll=()=>tx('readonly',s=>s.getAll()),put=i=>tx('readwrite',s=>s.put(i)),del=id=>tx('readwrite',s=>s.delete(id));
let items=[],cat='All',term='',draft=null;
const today=()=>{const d=new Date();d.setHours(0,0,0,0);return d};
const fd=d=>d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
const addM=(s,m)=>{const d=new Date(s+'T00:00'),n=d.getDate();d.setMonth(d.getMonth()+ +m);if(d.getDate()!==n)d.setDate(0);return fd(d)};
const left=i=>Math.round((new Date(i.expiry+'T00:00')-today())/DAY);
const st=i=>{const l=left(i);return l<0?['er','Expired']:l<=30?['wa',l+' d left']:['ok','Active']};
const fmt=s=>new Date(s+'T00:00').toLocaleDateString(undefined,{day:'numeric',month:'short',year:'numeric'});
const money=n=>n?Number(n).toLocaleString(undefined,{minimumFractionDigits:0})+' '+ls.get('cur','LKR'):'';
const shrink=f=>new Promise(r=>{const i=new Image();i.onload=()=>{const s=Math.min(1,900/Math.max(i.width,i.height)),c=document.createElement('canvas');c.width=i.width*s;c.height=i.height*s;c.getContext('2d').drawImage(i,0,0,c.width,c.height);r(c.toDataURL('image/jpeg',.7))};i.src=URL.createObjectURL(f)});

async function load(){items=await getAll();render();checkAlerts();syncNative()}
function render(){
 const exp=items.filter(i=>left(i)<0).length,soon=items.filter(i=>left(i)>=0&&left(i)<=30).length;
 $('#stats').innerHTML=[['Total',items.length],['Active',items.length-exp-soon],['Expiring',soon],['Expired',exp]].map(x=>`<div class="stat"><b>${x[1]}</b><span>${x[0]}</span></div>`).join('');
 $('#chips').innerHTML=['All',...CATS].map(c=>`<button class="chip ${c==cat?'on':''}" data-c="${esc(c)}">${esc(c)}</button>`).join('');
 const t=term.toLowerCase();
 const L=items.filter(i=>(cat=='All'||i.cat==cat)&&(!t||[i.name,i.brand,i.serial,i.store].join(' ').toLowerCase().includes(t))).sort((a,b)=>a.expiry<b.expiry?-1:1);
 $('#list').innerHTML=L.length?L.map(i=>{const [c,l]=st(i),tot=Math.max(1,(new Date(i.expiry)-new Date(i.pdate))/DAY),pc=Math.min(100,Math.max(0,(today()-new Date(i.pdate+'T00:00'))/DAY/tot*100));
  return `<div class="card" data-id="${i.id}">${i.photos?.[0]?`<img class="th" src="${i.photos[0]}">`:`<div class="th">${i.cat.split(' ')[0]}</div>`}<div class="i"><b>${esc(i.name)}</b><div class="sm">${esc(i.brand||'')} · ${esc(i.type)} to ${fmt(i.expiry)}</div><span class="bd ${c}">${l}</span><div class="bar"><i style="width:${pc}%;background:var(--${c})"></i></div></div></div>`}).join(''):'<div class="empty">No items yet.<br>Tap + to add your first warranty.</div>';
}
function alertsList(){return items.map(i=>({i,l:left(i)})).filter(x=>{const m=Math.max(...(x.i.rem?.length?x.i.rem:[0]));return x.l<=m&&x.l>=-14}).sort((a,b)=>a.l-b.l)}
function checkAlerts(){
 const A=alertsList();$('#alerts').innerHTML=A.map(x=>`<div class="alert ${x.l<=7?'e':'w'}" data-id="${x.i.id}">${x.l<0?'⛔ Expired '+(-x.l)+' d ago':x.l==0?'⚠️ Expires TODAY':'⏰ '+x.l+' day'+(x.l>1?'s':'')+' left'}: <b>${esc(x.i.name)}</b></div>`).join('');
 if(NAT||!ls.get('notif',false)||!('Notification'in window)||Notification.permission!=='granted')return;
 A.forEach(x=>{const th=Math.min(...(x.i.rem||[]).filter(r=>r>=x.l),0>x.l?0:999);const k='n_'+x.i.id+'_'+(x.l<0?'x':th)+'_'+x.i.expiry;if(ls.get(k))return;ls.set(k,1);
  try{new Notification('Warranty alert',{body:x.i.name+(x.l<0?' warranty has expired':x.l==0?' expires today':' expires in '+x.l+' day(s)'),tag:k})}catch{}})}
function form(i){
 const e=!!i;i=i||{name:'',cat:CATS[0],brand:'',serial:'',store:'',price:'',pdate:fd(new Date()),months:12,type:'Warranty',phone:'',notes:'',rem:[30,7,1],photos:[]};draft=JSON.parse(JSON.stringify(i));
 $('#dlg').innerHTML=`<h3 style="margin-top:0">${e?'Edit':'Add'} item</h3><form id="f">
 <label>Item name *</label><input name="name" required value="${esc(i.name)}">
 <div class="g2"><div><label>Category</label><select name="cat">${CATS.map(c=>`<option ${c==i.cat?'selected':''}>${c}</option>`).join('')}</select></div>
 <div><label>Type</label><select name="type">${['Warranty','Guarantee','Extended warranty','Service plan'].map(c=>`<option ${c==i.type?'selected':''}>${c}</option>`).join('')}</select></div>
 <div><label>Brand / model</label><input name="brand" value="${esc(i.brand)}"></div><div><label>Serial / IMEI</label><input name="serial" value="${esc(i.serial)}"></div>
 <div><label>Purchase date *</label><input type="date" name="pdate" required value="${i.pdate}"></div><div><label>Duration (months) *</label><input type="number" name="months" min="1" max="600" required value="${i.months}"></div>
 <div><label>Store / seller</label><input name="store" value="${esc(i.store)}"></div><div><label>Price</label><input type="number" name="price" min="0" value="${esc(i.price)}"></div></div>
 <label>Support phone</label><input type="tel" name="phone" value="${esc(i.phone)}">
 <label>Notes (claim terms, conditions)</label><textarea name="notes" rows="2">${esc(i.notes)}</textarea>
 <label>Remind me before expiry</label><div class="rm">${REM.map(r=>`<label><input type="checkbox" name="rem" value="${r}" ${i.rem.includes(r)?'checked':''}>${r}d</label>`).join('')}</div>
 <label>Photos (product, receipt, warranty card)</label><div class="ph" id="ph"></div><input type="file" id="fl" accept="image/*" multiple>
 <div style="margin-top:8px"><button class="btn p">Save</button><button type="button" class="btn" id="cx">Cancel</button></div></form>`;
 phs();$('#dlg').showModal();
 $('#cx').onclick=()=>$('#dlg').close();
 $('#fl').onchange=async e=>{for(const f of e.target.files)draft.photos.push(await shrink(f));e.target.value='';phs()};
 $('#f').onsubmit=async e=>{e.preventDefault();const d=new FormData(e.target),o={...draft};['name','cat','type','brand','serial','pdate','store','price','phone','notes'].forEach(k=>o[k]=d.get(k)||'');
  o.months=+d.get('months');o.rem=d.getAll('rem').map(Number);o.expiry=addM(o.pdate,o.months);o.id=o.id||Date.now()+'';await put(o);$('#dlg').close();load()}}
function phs(){$('#ph').innerHTML=draft.photos.map((p,n)=>`<div><img src="${p}"><u href="#" data-x="${n}">×</u></div>`).join('')}
function detail(id){const i=items.find(x=>x.id==id);if(!i)return;const [c,l]=st(i);
 $('#dlg').innerHTML=`<h3 style="margin-top:0">${esc(i.name)} <span class="bd ${c}">${l}</span></h3>
 ${[['Category',i.cat],['Type',i.type],['Brand / model',i.brand],['Serial',i.serial],['Store',i.store],['Price',money(i.price)],['Purchased',fmt(i.pdate)],['Expires',fmt(i.expiry)],['Reminders',(i.rem||[]).map(r=>r+'d').join(', ')||'None']].filter(r=>r[1]).map(r=>`<div class="row"><span class="sm">${r[0]}</span><span>${esc(r[1])}</span></div>`).join('')}
 ${i.notes?`<p>${esc(i.notes)}</p>`:''}<div class="big">${(i.photos||[]).map(p=>`<img src="${p}">`).join('')}</div>
 <div>${i.phone?`<a class="btn p" href="tel:${esc(i.phone)}" style="text-decoration:none;display:inline-block">📞 Support</a>`:''}<button class="btn" id="ics">📅 Add to calendar</button><button class="btn" id="ed">Edit</button><button class="btn d" id="dl">Delete</button><button class="btn" id="cl">Close</button></div>`;
 $('#dlg').showModal();$('#cl').onclick=()=>$('#dlg').close();$('#ed').onclick=()=>form(i);
 $('#ics').onclick=()=>dlf('warranty-'+i.name.replace(/\W+/g,'_')+'.ics',ics([i]),'text/calendar');
 $('#dl').onclick=async()=>{if(confirm('Delete this item?')){await del(i.id);$('#dlg').close();load()}}}
function ics(L){const z=s=>s.replace(/-/g,'');const e=s=>String(s).replace(/[,;\\]/g,m=>'\\'+m).replace(/\n/g,'\\n');
 return 'BEGIN:VCALENDAR\r\nVERSION:2.0\r\nPRODID:-//WarrantyVault//EN\r\n'+L.map(i=>{const n=new Date(i.expiry+'T00:00');n.setDate(n.getDate()+1);
  return `BEGIN:VEVENT\r\nUID:${i.id}@warrantyvault\r\nDTSTAMP:${z(fd(new Date()))}T000000Z\r\nDTSTART;VALUE=DATE:${z(i.expiry)}\r\nDTEND;VALUE=DATE:${z(fd(n))}\r\nSUMMARY:${e(i.type+' expires: '+i.name)}\r\nDESCRIPTION:${e([i.brand,i.serial&&'S/N '+i.serial,i.store,i.phone&&'Support '+i.phone].filter(Boolean).join(' | '))}\r\n`+(i.rem||[]).map(r=>`BEGIN:VALARM\r\nACTION:DISPLAY\r\nDESCRIPTION:${e(i.name)} warranty expires in ${r} day(s)\r\nTRIGGER:-P${r}DT-9H\r\nEND:VALARM\r\n`).join('')+'END:VEVENT\r\n'}).join('')+'END:VCALENDAR'}
const NAT=!!(window.Capacitor&&window.Capacitor.isNativePlatform&&window.Capacitor.isNativePlatform());
const PL=n=>window.Capacitor&&window.Capacitor.Plugins&&window.Capacitor.Plugins[n];
const hid=s=>{let h=0;for(const c of s)h=(h*31+c.charCodeAt(0))|0;return Math.abs(h)%2000000000+1};
async function syncNative(){const LN=PL('LocalNotifications');if(!NAT||!LN||!ls.get('notif',false))return;
 try{await LN.createChannel({id:'warranty',name:'Warranty alerts',importance:4,vibration:true});
 const p=await LN.getPending();if(p.notifications&&p.notifications.length)await LN.cancel({notifications:p.notifications.map(n=>({id:n.id}))});
 const out=[],now=Date.now();
 for(const i of items)for(const r of [...(i.rem||[]),0]){const d=new Date(i.expiry+'T09:00');d.setDate(d.getDate()-r);if(d<=now)continue;
  out.push({id:hid(i.id+':'+r),channelId:'warranty',title:r?'Warranty ending soon':'Warranty expires today',body:i.name+(r?' expires in '+r+' day'+(r>1?'s':'')+' ('+fmt(i.expiry)+')':' today'),schedule:{at:d,allowWhileIdle:true}})}
 if(out.length)await LN.schedule({notifications:out})}catch(e){console.log(e)}}
async function dlf(n,t,m){const FS=PL('Filesystem'),SH=PL('Share');
 if(NAT&&FS&&SH){try{await FS.writeFile({path:n,data:t,directory:'CACHE',encoding:'utf8'});const u=await FS.getUri({path:n,directory:'CACHE'});await SH.share({title:n,url:u.uri,dialogTitle:'Save or open with…'})}catch(e){alert('Export failed: '+(e.message||e))}return}
 const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([t],{type:m}));a.download=n;a.click()}
function settings(){const ok=NAT||'Notification'in window;
 $('#dlg').innerHTML=`<h3 style="margin-top:0">Settings & backup</h3>
 <p class="sm">${NAT?'Alerts are scheduled on your phone (9:00 AM on each reminder day) and fire even when the app is closed.':'Alerts show in-app when opened. For alerts when closed, export reminders to your calendar.'}</p>
 <label><input type="checkbox" id="nt" style="width:auto" ${ls.get('notif',false)?'checked':''} ${ok?'':'disabled'}> Enable device notifications</label><br>
 <label>Currency</label><input id="cu" value="${esc(ls.get('cur','LKR'))}" maxlength="5">
 <button class="btn p" id="ia">📅 Export ALL reminders to calendar (.ics)</button>
 <button class="btn" id="ex">⬇️ Backup (JSON)</button><label class="btn" style="display:inline-block">⬆️ Restore<input type="file" id="im" accept=".json" hidden></label>
 <button class="btn" id="cl">Close</button>`;
 $('#dlg').showModal();$('#cl').onclick=()=>{ls.set('cur',$('#cu').value||'LKR');$('#dlg').close();render()};
 $('#nt').onchange=async e=>{if(e.target.checked){let g;if(NAT)g=(await PL('LocalNotifications').requestPermissions()).display==='granted';else g=(await Notification.requestPermission())==='granted';e.target.checked=g}ls.set('notif',e.target.checked);checkAlerts();syncNative()};
 $('#ia').onclick=()=>dlf('all-warranties.ics',ics(items),'text/calendar');
 $('#ex').onclick=()=>dlf('warranty-backup-'+fd(new Date())+'.json',JSON.stringify(items),'application/json');
 $('#im').onchange=async e=>{try{const a=JSON.parse(await e.target.files[0].text());for(const i of a)await put(i);alert('Restored '+a.length+' items');$('#dlg').close();load()}catch{alert('Invalid backup file')}}}
document.addEventListener('click',e=>{const t=e.target;
 if(t.dataset.c){cat=t.dataset.c;render()}else if(t.dataset.x!==undefined){e.preventDefault();draft.photos.splice(+t.dataset.x,1);phs()}
 else{const c=t.closest('[data-id]');if(c)detail(c.dataset.id)}});
$('#q').oninput=e=>{term=e.target.value;render()};$('#add').onclick=()=>form();$('#gear').onclick=settings;
$('#bell').onclick=()=>{const A=alertsList();alert(A.length?A.map(x=>(x.l<0?'EXPIRED: ':x.l+'d: ')+x.i.name).join('\n'):'No alerts. All warranties are healthy ✅')};
if(NAT&&ls.get('notif',null)===null&&PL('LocalNotifications')){PL('LocalNotifications').requestPermissions().then(r=>{ls.set('notif',r.display==='granted');syncNative()}).catch(()=>{})}
load();document.addEventListener('visibilitychange',()=>{if(!document.hidden){render();checkAlerts()}});
</script></body></html>
